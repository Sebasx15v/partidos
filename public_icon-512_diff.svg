--- public/icon-512.svg (原始)


+++ public/icon-512.svg (修改后)
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a472a"/>
      <stop offset="100%" style="stop-color:#2d8a4e"/>
    </linearGradient>
    <linearGradient id="ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Field lines -->
  <rect x="24" y="24" width="464" height="464" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  <line x1="256" y1="24" x2="256" y2="488" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  <circle cx="256" cy="256" r="64" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  <circle cx="256" cy="256" r="8" fill="rgba(255,255,255,0.5)"/>
  <!-- Penalty areas -->
  <rect x="24" y="156" width="80" height="200" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
  <rect x="408" y="156" width="80" height="200" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
  <!-- Soccer ball -->
  <circle cx="256" cy="200" r="72" fill="url(#ball)" stroke="#333" stroke-width="4" filter="url(#shadow)"/>
  <!-- Pentagon pattern -->
  <polygon points="256,136 280,160 270,196 242,196 232,160" fill="#333"/>
  <polygon points="256,264 232,240 242,204 270,204 280,240" fill="#333"/>
  <polygon points="192,200 216,176 240,184 240,216 216,224" fill="#333"/>
  <polygon points="320,200 296,224 272,216 272,184 296,176" fill="#333"/>
  <polygon points="256,200 240,184 240,200 256,216 272,200 272,184" fill="#333" opacity="0.5"/>
  <!-- Text -->
  <text x="256" y="360" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="52" fill="#FFD700" filter="url(#shadow)">CLÁSICOS</text>
  <text x="256" y="420" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="36" fill="#88ff88" filter="url(#shadow)">PIXEL FC</text>
  <!-- Pixel decoration -->
  <rect x="40" y="40" width="8" height="8" fill="#FFD700" opacity="0.6"/>
  <rect x="464" y="40" width="8" height="8" fill="#FFD700" opacity="0.6"/>
  <rect x="40" y="464" width="8" height="8" fill="#FFD700" opacity="0.6"/>
  <rect x="464" y="464" width="8" height="8" fill="#FFD700" opacity="0.6"/>
</svg>
