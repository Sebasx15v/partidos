--- public/icon-192.svg (原始)


+++ public/icon-192.svg (修改后)
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a472a"/>
      <stop offset="100%" style="stop-color:#2d8a4e"/>
    </linearGradient>
    <linearGradient id="ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" fill="url(#bg)"/>
  <!-- Field lines -->
  <rect x="10" y="10" width="172" height="172" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="96" y1="10" x2="96" y2="182" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <circle cx="96" cy="96" r="24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <circle cx="96" cy="96" r="3" fill="rgba(255,255,255,0.5)"/>
  <!-- Soccer ball -->
  <circle cx="96" cy="80" r="28" fill="url(#ball)" stroke="#333" stroke-width="2"/>
  <!-- Pentagon pattern -->
  <polygon points="96,56 106,66 102,80 90,80 86,66" fill="#333"/>
  <polygon points="96,104 86,94 90,80 102,80 106,94" fill="#333"/>
  <polygon points="72,80 82,70 90,74 90,86 82,90" fill="#333"/>
  <polygon points="120,80 110,90 102,86 102,74 110,70" fill="#333"/>
  <!-- Text -->
  <text x="96" y="140" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="20" fill="#FFD700">CLÁSICOS</text>
  <text x="96" y="162" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="14" fill="#88ff88">FC</text>
</svg>
