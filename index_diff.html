+++ index.html (修改后)
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>⚽ Clásicos del Fútbol - Pixel Edition</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="Simulador de clásicos del fútbol en pixel art con jugadores reales" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clásicos FC" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Manifest -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon-192.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.svg" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a1a;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* Loading screen */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background: #0a0a1a;
        color: #22c55e;
        font-family: monospace;
        font-size: 24px;
      }
    </style>

    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swUrl = '%BASE_URL%sw.js';
          navigator.serviceWorker.register(swUrl)
            .then((registration) => {
              console.log('SW registered:', registration);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="loading">⚽ Cargando Clásicos FC...</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
